name: Update matchup data

on:
  push:
    branches: [main, "claude/**"]
    paths: ["scripts/fetch_meta.py", ".github/workflows/update-meta.yml"]
  workflow_dispatch:
  schedule:
    - cron: "43 8 * * 1,4" # Mondays and Thursdays

permissions:
  contents: write

concurrency:
  group: meta-${{ github.ref }}
  cancel-in-progress: false

jobs:
  meta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch leaders, meta share and decklists
        timeout-minutes: 30
        env:
          PYTHONUNBUFFERED: "1"
        run: python scripts/fetch_meta.py
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/meta.json
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Update matchup data [data]"
          git pull --rebase -X theirs origin "${GITHUB_REF_NAME}"
          git push
