name: Update cards and deploy

on:
  push:
    branches: [main, "claude/**"]
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * 1" # every Monday: refresh prices

permissions:
  contents: write

concurrency:
  group: update-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    if: "!contains(github.event.head_commit.message, '[data]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch cards, images and prices
        timeout-minutes: 120
        env:
          PYTHONUNBUFFERED: "1"
        run: python scripts/fetch_cards.py
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data site/images
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Update card data and prices [data]"
          git pull --rebase -X theirs origin "${GITHUB_REF_NAME}"
          git push

  deploy:
    needs: update
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Deploy to Cloudflare Pages
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: |
          npx --yes wrangler@3 pages project create zoro-cards --production-branch=main || true
          npx --yes wrangler@3 pages deploy site --project-name=zoro-cards --branch=main
      - name: Explain missing secrets
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::notice::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repo secrets to deploy to Cloudflare Pages (see README)."
